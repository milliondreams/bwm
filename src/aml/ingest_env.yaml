# Conda env for the AzureML EDGAR ingest job.
#
# CPU-only — the ingest is API-bound (rate-limited to 9 req/s by SEC), so
# even a tiny CPU node saturates the network bottleneck. Model-training
# packages (torch, mamba-ssm) are deliberately omitted: this env is for
# ingest + canonical-write only.
#
# Versions track pyproject.toml at the time the env image is baked. Bumping
# any package here requires also bumping pyproject.toml to stay in sync.
name: bwm-ingest
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - aiohttp>=3.13.5
      - tenacity>=9.1.4
      - lxml>=6.1.1
      - pyarrow>=17.0.0
      - pandas>=2.2.0
      - requests>=2.32.0
      - fsspec>=2024.10.0
      - azureml-fsspec>=1.3.0
      - rapidfuzz>=3.14.5
      - yfinance>=1.3.0
      - fredapi>=0.5.2
      - pydantic>=2.9.0
