[project]
name = "norn-bwm"
version = "0.1.0"
description = "AzureML training pipeline scaffold"
requires-python = ">=3.11,<3.13"
dependencies = [
    "azure-ai-ml>=1.20.0",
    "azure-identity>=1.19.0",
    "mlflow>=2.18.0",
    "azureml-mlflow>=1.58.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "fsspec>=2024.10.0",
    "azureml-fsspec>=1.3.0",
    "aiohttp>=3.13.5",
    "tenacity>=9.1.4",
    "lxml>=6.1.1",
    "rapidfuzz>=3.14.5",
    "yfinance>=1.3.0",
    "fredapi>=0.5.2",
    "openai>=2.37.0",
    "torch>=2.4.0",
    "pylance>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aml", "src/training", "src/data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests > a few seconds (deselect with -m 'not slow')",
    "network: tests requiring live network (deselect with -m 'not network')",
]
